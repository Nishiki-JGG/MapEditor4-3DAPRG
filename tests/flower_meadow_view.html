<!doctype html><meta charset="utf-8"><title>配置で配色する花畑</title>
<style>html,body{margin:0;overflow:hidden;background:#a9b8bd;font:14px sans-serif}canvas{display:block}#bar{position:fixed;z-index:2;top:8px;left:8px;padding:10px;background:#fffffff0;border-radius:6px}button,select{padding:5px;margin:2px}#help{position:fixed;bottom:12px;left:12px;padding:8px;background:#ffffffe8;pointer-events:none}</style>
<div id="bar">配置で配色する花畑 / 基準人型1.8m<br><button onclick="arrange('all')">色別一覧</button><button onclick="arrange('mono')">同色で広く</button><button onclick="arrange('mixed')">混ぜてカラフル</button><button onclick="arrange('bands')">色の帯</button><select id="colour"></select><button onclick="angle(false)">真上90度</button><button onclick="angle(true)">斜め</button><label><input id="wind" type="checkbox" checked>風</label><label><input id="contact" type="checkbox">接触</label></div>
<div id="help">同色を並べると統一感、違う色を混ぜるとカラフルに。約0.85〜1.05m間隔を目安に、向きと倍率を少し変えて配置。</div>
<script src="../three.min.js"></script><script src="../props/shared/assets.js?v=root-bark1"></script><script src="../props/shared/pine-wind.js?v=root-bark1"></script><script src="../props/shared/shared.js?v=root-bark1"></script><script>
const ids=['meadowwhite','meadowyellow','meadowpink','meadowred','meadowviolet'];
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(1280,900);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;renderer.shadowMap.enabled=true;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#a9b8bd');scene.add(new THREE.HemisphereLight(0xd6e8ff,0x6a5a3e,1.05));const sun=new THREE.DirectionalLight(0xffe0b0,2.6);sun.position.set(-48,62,-14);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-9,right:9,top:9,bottom:-9,far:150});scene.add(sun);
const camera=new THREE.OrthographicCamera(-7,7,4.921875,-4.921875,.1,100);const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({color:'#899774'}));ground.receiveShadow=true;scene.add(ground);
const human=new THREE.Mesh(new THREE.CapsuleGeometry(.3,1.2,3,8),new THREE.MeshLambertMaterial({color:'#deb58b'}));human.position.set(5.2,.9,1.5);human.castShadow=true;scene.add(human);
const objects=[],plants=[];let mode='all',oblique=false,clock=0,run=true,wind=true,contact=false;window.meadowReady=false;THREE.DefaultLoadingManager.onLoad=()=>{renderer.render(scene,camera);window.meadowReady=true;};
for(const id of ids)document.getElementById('colour').add(new Option(TDSharedProps.asset(id).displayName,id));document.getElementById('colour').onchange=()=>arrange('mono');document.getElementById('wind').onchange=e=>wind=e.target.checked;document.getElementById('contact').onchange=e=>contact=e.target.checked;
window.angle=v=>{oblique=v;camera.up.set(0,0,-1);camera.position.set(0,25,v?16:0);camera.lookAt(0,0,0);camera.updateMatrixWorld(true);renderer.render(scene,camera);};
window.arrange=next=>{mode=next;for(const o of objects){scene.remove(o);o.geometry.dispose();o.material.dispose();if(o.customDepthMaterial)o.customDepthMaterial.dispose();}objects.length=plants.length=0;const rows=[];if(mode==='all')ids.forEach((id,i)=>rows.push({id,x:(i-2)*2,z:0,r:0,s:1}));else for(let z=0;z<6;z++)for(let x=0;x<9;x++){const seed=(x*71+z*139)%97,jitter=seed/97-.5,hash=Math.imul((x+z*9+1)^0x74a5,0x45d9f3b),mix=(Math.imul(hash^(hash>>>16),0x45d9f3b)>>>0)%5,id=mode==='mono'?document.getElementById('colour').value:ids[mode==='bands'?Math.min(4,Math.floor(x*5/9)):mix];rows.push({id,x:(x-4)*.86+jitter*.14,z:(z-2.5)*.88+jitter*.12,r:seed*2.399,s:.9+(seed%5)*.045});}
for(const id of ids){const list=rows.filter(p=>p.id===id);if(!list.length)continue;const g=TDSharedProps.geometry(id).clone(),touch=new THREE.InstancedBufferAttribute(new Float32Array(list.length*3),3);g.setAttribute('touch',touch);const o=new THREE.InstancedMesh(g,TDPineWind.touchMaterial(TDSharedProps.material(id)),list.length);o.castShadow=true;o.customDepthMaterial=TDPineWind.shadowMaterial(o.material);o.frustumCulled=false;for(let i=0;i<list.length;i++){const p=list[i];o.setMatrixAt(i,new THREE.Matrix4().compose(new THREE.Vector3(p.x,0,p.z),new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),p.r),new THREE.Vector3(p.s,p.s,p.s)));plants.push({...p,index:i,mesh:o,spring:{bx:0,bz:0,vx:0,vz:0}});}scene.add(o);objects.push(o);}angle(oblique);};
window.stepMeadow=dt=>{clock+=dt;TDPineWind.set(clock,.8,.6,wind?.8:0);if(contact)human.position.set(Math.sin(clock*.8)*4.8,.9,.1);else human.position.set(5.2,.9,1.5);for(const p of plants){const a=TDSharedProps.asset(p.id),cfg=a.contact,dx=p.x-human.position.x,dz=p.z-human.position.z,target=contact?TDPineWind.target(dx,dz,cfg.radius*p.s+.3,Math.cos(clock*.8)*3.84,0,cfg.maxDisplacementMetres*p.s):[0,0];TDPineWind.advance(p.spring,...target,cfg.maxDisplacementMetres*p.s,dt);p.mesh.geometry.attributes.touch.setXYZ(p.index,p.spring.bx,p.spring.bz,1/a.wind.maxY);}for(const o of objects)o.geometry.attributes.touch.needsUpdate=true;renderer.render(scene,camera);};
window.meadowPreview={stop(){run=false;},state(){return{mode,clock,wind,contact,count:plants.length,ids:objects.map(o=>o.material.userData.sharedWind),ready:window.meadowReady};}};arrange('all');let previous=performance.now();function frame(now){const dt=Math.min(.05,(now-previous)/1000);previous=now;if(run)stepMeadow(dt);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script>
