<!doctype html><meta charset="utf-8"><title>洞窟壁・接続の比較</title>
<style>body{margin:0;background:#10151b;color:#eee;font:14px sans-serif}header{height:42px;display:flex;align-items:center;gap:10px;padding:0 10px}select,label{color:#eee;background:#25313d;padding:4px}iframe{border:0;width:100%;height:calc(100vh - 70px)}footer{font-size:12px;padding:4px}</style>
<header>洞窟壁 <select id="layout"><option value="family">既存6部品</option><option value="corner">90度内角</option><option value="outer">外角・終端</option><option value="entrance">入口</option></select><select id="view"><option>oblique</option><option>top</option><option>walk</option><option>low</option></select><label><input type="checkbox" id="before">変更前</label><label><input type="checkbox" id="joint" checked>継ぎ・裾岩</label><select id="light"><option value="neutral">中立照明</option><option value="torch">松明</option></select><button id="refresh">再配置</button></header>
<iframe id="editor" src="../index.html#size=24"></iframe><footer>ユーザーPCの隔離比較。水・地形・保存済みマップは変更しない。</footer>
<script>
let W,A;const wait=ms=>new Promise(r=>setTimeout(r,ms));
async function init(){W=editor.contentWindow;for(let k=0;k<300;k++){if(W.__app&&!W.__app.preparation)break;await wait(100);}A=W.__app;if(!A)throw Error('Editor startup');W.requestAnimationFrame=()=>0;await wait(100);for(const el of W.document.querySelectorAll('body > :not(canvas)'))el.style.display='none';for(const id of ['layout','view','before','joint','light'])document.getElementById(id).onchange=arrange;refresh.onclick=arrange;arrange();window.wallReady=true;}
function arrange(){A.setMode('edit');A.genFlat();A.applyBiome('cave');A.state.atmo.kind='none';A.state.weather.kind='none';A.state.water=-10;A.applyAtmo();A.H.fill(0);A.S.fill(0);A.C.fill(0);for(let i=0;i<A.H.length;i++)A.S[i*9+3]=255;A.props.splice(0);const add=(id,x,z,angle=0,scale=1,sy=1)=>A.props.push([A.PROP.findIndex(t=>t.id===id),x,z,angle,scale,0,sy,null]);
if(layout.value==='family'){['cliff','cliff_split','cliff_shoulder','cliff_joint'].forEach((id,k)=>add(id,-4.5+k*3,0));add('cliff_slab',-2,2.5);add('cliff_talus',2,2.5);}
else if(layout.value==='entrance'){for(const s of [-1,1]){add('cliff_shoulder',s*3.6,-1,s*.12);add('cliff_split',s*5,-2.2,s*.25);if(joint.checked){add('cliff_joint',s*2.3,-.7,s*.15);add('cliff_slab',s*2.8,.4,s*.2);add('cliff_talus',s*4,.8);}}add('mossrock',3,1);add('fern',3.1,1.4,.7,.8);add('fern',4,.2,2,.65);add('ivy',-2.8,1.2,1,.8);add('shelfshroom',-3.8,.4);add('torch',0,-3);}
else{add('cliff',-1.25,0);add('cliff_shoulder',0,-1.25,Math.PI/2);if(joint.checked){add('cliff_joint',.10,.10,Math.PI/4);add('cliff_slab',-.8,.65,.3);add('cliff_talus',.65,-.8,1.2);}if(layout.value==='outer')add('cliff_split',-3.1,0);}
A.ensureIds();A.updateTerrain();A.rebuildProps();A.update(0);const scene=A.terrain.parent;scene.children.filter(o=>o.geometry?.type==='ConeGeometry').forEach(o=>o.visible=false);A.hero.visible=true;A.hero.position.set(layout.value==='family'?-1.6:1.8,0,2.4);const sun=scene.children.find(o=>o.isDirectionalLight);scene.children.filter(o=>o.isHemisphereLight).forEach(o=>o.intensity=light.value==='neutral'?.9:.13);sun.intensity=light.value==='neutral'?2.1:0;sun.position.set(5,9,4);if(light.value==='neutral')scene.children.filter(o=>o.isPointLight).forEach(o=>o.intensity=0);
if(W.TDCaveWall){W.TDCaveWall.enabled=!before.checked;A.rebuildProps(true);}A.camera.up.set(0,1,0);const wide=layout.value==='family'||layout.value==='entrance';if(view.value==='top'){A.camera.up.set(0,0,-1);A.camera.position.set(0,wide?15:10,0);}else if(view.value==='walk')A.camera.position.set(wide?8:6,1.8,wide?12:8);else if(view.value==='low')A.camera.position.set(wide?7:5,.7,wide?11:7);else A.camera.position.set(wide?9:6,wide?8:6,wide?12:8);if(layout.value==='outer'&&view.value!=='top')A.camera.position.x*=-1;A.camera.lookAt(layout.value==='family'?0:-.6,.8,0);A.camera.updateMatrixWorld(true);A.setPanel(false);A.render();window.wallStats={layout:layout.value,view:view.value,calls:A.renderer.info.render.calls,triangles:A.renderer.info.render.triangles,props:A.props.length};}
editor.onload=()=>init().catch(e=>{document.querySelector('footer').textContent=e.stack;console.error(e);});
</script>
