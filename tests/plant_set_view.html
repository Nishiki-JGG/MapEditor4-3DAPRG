<!doctype html><meta charset="utf-8"><title>植物セット・寸法確認</title>
<style>html,body{overflow:hidden;margin:0;background:#b9c7d0;font:14px sans-serif}canvas{display:block}#bar{z-index:2;position:fixed;top:8px;left:12px;background:#ffffffdf;padding:8px;border-radius:6px}button,select{margin:3px;padding:5px}.label{z-index:1;position:absolute;transform:translateX(-50%);background:#ffffffd8;padding:3px 7px;border-radius:4px;pointer-events:none;white-space:nowrap}</style>
<div id="bar">基準人型 1.8 m / 標準倍率1　<button onclick="view('all','top')">真上90度</button><button onclick="view('all','oblique')">斜め一覧</button><button onclick="view('trees','top')">樹木</button><button onclick="view('low','top')">低木・下草</button><button onclick="view('all','far')">遠景</button><select id="asset"></select><label><input id="previewWind" type="checkbox" checked>風</label><label><input id="previewContact" type="checkbox">接触テスト</label></div>
<script src="../three.min.js"></script><script src="../props/shared/assets.js?v=root-bark1"></script><script src="../props/shared/pine-wind.js?v=root-bark1"></script><script src="../props/shared/shared.js?v=root-bark1"></script><script>
const ids=['birch','willow','scotspine','hazel','bramble','ivy','sedge','foxglove','horsetail','dock'];
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(1600,1000);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#b9c7d0');scene.add(new THREE.HemisphereLight(0xd6e8ff,0x6a5a3e,1.05));const sun=new THREE.DirectionalLight(0xffe0b0,2.6);sun.position.set(-48,62,-14);scene.add(sun);
const camera=new THREE.OrthographicCamera(-15,15,9.375,-9.375,.1,100);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({color:'#899774'}));scene.add(ground);
const poses=[[-7,-5],[0,-5],[7,-5],[-7,3],[0,3],[7,3],[-9,8],[-3,8],[3,8],[9,8]],objects=[],humans=[],labels=[];
window.plantGalleryReady=false;THREE.DefaultLoadingManager.onLoad=()=>{renderer.render(scene,camera);window.plantGalleryReady=true;};
for(let i=0;i<ids.length;i++){const a=TDSharedProps.asset(ids[i]),geo=TDSharedProps.geometry(a.id);geo.setAttribute('touch',new THREE.InstancedBufferAttribute(new Float32Array(3),3));const o=new THREE.InstancedMesh(geo,TDPineWind.touchMaterial(TDSharedProps.material(a.id)),1);o.setMatrixAt(0,new THREE.Matrix4());o.frustumCulled=false;o.userData.spring={bx:0,bz:0,vx:0,vz:0};o.position.set(poses[i][0],0,poses[i][1]);scene.add(o);objects.push(o);const human=new THREE.Mesh(new THREE.CapsuleGeometry(.3,1.2,3,8),new THREE.MeshLambertMaterial({color:'#deb58b'}));human.position.set(poses[i][0]+(i<3?1:1.15),.9,poses[i][1]+(i<3?1:.25));scene.add(human);humans.push(human);const label=document.createElement('div');label.className='label';label.textContent=a.displayName+' / '+a.triangles.length/3+' tri';document.body.append(label);labels.push(label);document.getElementById('asset').add(new Option(a.displayName,a.id));}
document.getElementById('asset').insertBefore(new Option('単体を見る',''),document.getElementById('asset').firstChild);document.getElementById('asset').selectedIndex=0;document.getElementById('asset').onchange=e=>{if(e.target.value)view(e.target.value,'top');};
window.view=(mode='all',angle='top')=>{let active=ids.map(()=>true);if(mode==='trees')active=ids.map((_,i)=>i<3);else if(mode==='low')active=ids.map((_,i)=>i>=3);else if(ids.includes(mode))active=ids.map(id=>id===mode);let target=new THREE.Vector3(0,0,1.5),size=15;if(mode==='trees'){target.z=-5;size=13;}else if(mode==='low'){target.z=5.5;size=12;}else if(ids.includes(mode)){const i=ids.indexOf(mode);target.set(...[poses[i][0],0,poses[i][1]]);size=i<3?5.6:1.7;}if(angle==='oblique'){target.y=ids.includes(mode)?Math.max(...TDSharedProps.asset(mode).positions.filter((v,i)=>i%3===1))*.45:2.5;size*=1.17;}if(angle==='far')size*=1.9;document.getElementById('asset').value=ids.includes(mode)?mode:'';camera.left=-size;camera.right=size;camera.top=size/1.6;camera.bottom=-camera.top;camera.updateProjectionMatrix();camera.up.set(0,0,-1);camera.position.copy(target).add(new THREE.Vector3(0,35,angle==='oblique'?26:0));camera.lookAt(target);camera.updateMatrixWorld(true);for(let i=0;i<ids.length;i++){objects[i].visible=humans[i].visible=active[i];labels[i].style.display=active[i]?'block':'none';const h=i<3?2.5:1.0,p=new THREE.Vector3(poses[i][0],0,poses[i][1]+h).project(camera);labels[i].style.left=(p.x+1)*800+'px';labels[i].style.top=(1-p.y)*500+'px';}renderer.render(scene,camera);};view();
window.motionPreview={wind:true,contact:false,run:true,time:0};document.getElementById('previewWind').onchange=e=>motionPreview.wind=e.target.checked;document.getElementById('previewContact').onchange=e=>motionPreview.contact=e.target.checked;
window.stepPlantPreview=dt=>{motionPreview.time+=dt;const time=motionPreview.time;TDPineWind.set(time,.8,.6,motionPreview.wind?.8:0);for(let i=0;i<ids.length;i++){const a=TDSharedProps.asset(ids[i]),cfg=a.contact,human=humans[i],o=objects[i],st=o.userData.spring;let target=[0,0];if(motionPreview.contact){const x=poses[i][0]+Math.sin(time*1.1+i*.31)*1.45,z=poses[i][1]+.12,prev=human.userData.previous;human.position.set(x,.9,z);if(cfg.minY<1.8)target=TDPineWind.target(poses[i][0]-x,poses[i][1]-z,cfg.radius+.3,prev&&dt>0?(x-prev[0])/dt:0,prev&&dt>0?(z-prev[1])/dt:0,cfg.maxDisplacementMetres);human.userData.previous=[x,z];}else{human.userData.previous=null;human.position.set(poses[i][0]+(i<3?1:1.15),.9,poses[i][1]+(i<3?1:.25));}TDPineWind.advance(st,target[0],target[1],cfg.maxDisplacementMetres,dt);const touch=o.geometry.attributes.touch;touch.setXYZ(0,st.bx,st.bz,1/a.wind.maxY);touch.needsUpdate=true;}renderer.render(scene,camera);};let previewLast=performance.now();function previewFrame(now){const dt=Math.min(.05,(now-previewLast)/1000);previewLast=now;if(motionPreview.run)stepPlantPreview(dt);requestAnimationFrame(previewFrame);}requestAnimationFrame(previewFrame);
</script>
