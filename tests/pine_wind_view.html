<!DOCTYPE html><meta charset="utf-8"><style>html,body{margin:0}canvas{display:block}</style><body>
<script src="../three.min.js"></script><script src="../props/shared/assets.js"></script><script src="../props/shared/pine-wind.js"></script><script src="../props/shared/shared.js"></script>
<script>
const renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});renderer.setSize(1024,640);renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#b8c4cc');const camera=new THREE.OrthographicCamera(-4,4,4,-1,.1,100);camera.position.set(0,3.2,12);camera.lookAt(0,3.2,0);camera.top=3.5;camera.bottom=-3.5;camera.left=-5.6;camera.right=5.6;camera.updateProjectionMatrix();
const geo=TDSharedProps.geometry('pine'),base=TDSharedProps.material('pine'),mat=new THREE.MeshBasicMaterial({map:base.map,vertexColors:true,alphaTest:.42,side:THREE.DoubleSide});TDPineWind.attach(mat);
const staticMat=mat.clone();staticMat.onBeforeCompile=()=>{};staticMat.customProgramCacheKey=()=> 'pine-static-reference';
const pine=new THREE.Mesh(geo,mat);scene.add(pine);
const floor=new THREE.Mesh(new THREE.BoxGeometry(20,.1,20),new THREE.MeshBasicMaterial({color:'#889873'}));floor.position.y=-.05;scene.add(floor);
const human=new THREE.Mesh(new THREE.CapsuleGeometry(.3,1.2,4,8),new THREE.MeshBasicMaterial({color:'#e0ad76'}));human.position.set(.9,.9,0);scene.add(human);
window.preview=(time=0,strength=1,reference=false)=>{TDPineWind.set(time,.8,.6,strength);pine.material=reference?staticMat:mat;renderer.setRenderTarget(null);renderer.render(scene,camera);};
window.probe=(time,strength,rot=0,sx=1,sy=1)=>{
 TDPineWind.set(time,.8,.6,strength);const n=geo.attributes.position.count,g=geo.clone();g.setIndex(null);g.setAttribute('probeIndex',new THREE.Float32BufferAttribute(Array.from({length:n},(_,i)=>i),1));
 const matrix=new THREE.Matrix4().compose(new THREE.Vector3(2,0,-3),new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0),rot),new THREE.Vector3(sx,sy,sx));
 const material=new THREE.ShaderMaterial({uniforms:{...TDPineWind.uniforms,probeMatrix:{value:matrix},probeCount:{value:n}},vertexShader:`attribute float probeIndex;uniform mat4 probeMatrix;uniform float probeCount;varying vec3 result;${TDPineWind.GLSL}\nvoid main(){vec4 p=probeMatrix*vec4(position,1.);vec4 origin=probeMatrix*vec4(0.,0.,0.,1.);vec2 d=pineOffset(position.y,uv.y,vec2(origin.x,-origin.z));p.xz+=vec2(d.x,-d.y);result=vec3(p.x,p.y,-p.z);gl_Position=vec4((probeIndex+.5)/probeCount*2.-1.,0.,0.,1.);gl_PointSize=1.;}`,fragmentShader:'varying vec3 result;void main(){gl_FragColor=vec4(result,1.);}',depthTest:false,depthWrite:false});
 const ps=new THREE.Points(g,material),sc=new THREE.Scene();ps.frustumCulled=false;sc.add(ps);const rt=new THREE.WebGLRenderTarget(n,1,{type:THREE.FloatType,format:THREE.RGBAFormat,minFilter:THREE.NearestFilter,magFilter:THREE.NearestFilter,depthBuffer:false});renderer.setRenderTarget(rt);renderer.render(sc,camera);const values=new Float32Array(n*4);renderer.readRenderTargetPixels(rt,0,0,n,1,values);renderer.setRenderTarget(null);g.dispose();material.dispose();rt.dispose();return Array.from(values);
};window.preview(0,0);
</script>
