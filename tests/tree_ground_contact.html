<!doctype html><html lang="ja"><meta charset="utf-8"><title>樹木の接地比較・実エディタ</title>
<style>body{margin:0;font:14px sans-serif;background:#151b20;color:#eee}header{height:64px;padding:8px;box-sizing:border-box}button,select,input{margin:2px}iframe{display:block;border:0;width:100%;height:calc(100vh - 64px)}#status{font-size:12px}</style>
<header><select id="tree"></select><select id="ground"><option value="grass">草地</option><option value="dirt">土</option><option value="rubble">瓦礫地</option></select><select id="view"><option value="low">低い補助視点</option><option value="top">真上90度・全体</option><option value="root-top">真上90度・根元のみ</option></select><select id="scale"><option value="1">標準サイズ</option><option value=".7">0.7倍</option><option value="1.3">1.3倍</option></select><label><input type="checkbox" id="slope">緩斜面10%</label><label><input type="checkbox" id="neighbors">隣接配置</label><div id="status">実エディタを読み込み中。根元のみ表示は検査用に樹冠を切り取ります。</div></header>
<iframe id="editor" src="../index.html#size=64" title="実際のマップエディタで接地を確認"></iframe>
<script>
let ready=false;window.contactReady=false;const frame=document.getElementById('editor'),$=id=>document.getElementById(id);
function arrange(){if(!ready)return;const W=frame.contentWindow,A=W.__app,T=W.THREE,id=$('tree').value,ground=$('ground').value,s=+$('scale').value,grade=$('slope').checked?.1:0,view=$('view').value,big=id==='worldtree',N=Math.sqrt(A.H.length);A.setMode('edit');A.genFlat();A.deserialize(A.serialize());A.state.water=-20;A.state.weather.kind='none';A.state.atmo.kind='none';A.state.sunOn=true;A.applyAtmo();for(let j=0;j<N;j++)for(let i=0;i<N;i++)A.H[j*N+i]=grade*(i/(N-1)*A.SIZE-A.SIZE/2);A.S.fill(0);if(ground!=='grass')for(let k=0;k<N*N;k++)A.S[k*9+(ground==='dirt'?0:3)]=255;A.updateTerrain();const type=A.PROP.findIndex(t=>t.id===id);A.props.push([type,0,0,.39,s,0,1,null]);if($('neighbors').checked)A.props.push([type,big?9:2.4,big?2:1.8,1.8,s*.78,0,1.2,null]);A.ensureIds();A.rebuildProps();A.state.spawn={x:(big?7:1.8)*s,z:0};A.setMode('play');A.update(0);const top=view!=='low',height=(big?49:15)*s;A.camera.position.set(top?0:(big?11:3.3)*s,top?height:(big?4.2:1.7)*s,top?0:(big?15:4.8)*s);A.camera.up.set(0,top?0:1,top?-1:0);A.camera.lookAt(0,top?0:(big?.7:.22)*s,0);if($('neighbors').checked){const mx=big?4.5:1.2,mz=big?1:.9;A.camera.position.x+=mx;A.camera.position.z+=mz;if(top)A.camera.position.y*=1.6;else{A.camera.position.y*=1.5;A.camera.position.z+=(big?8:3)*s;}A.camera.lookAt(mx,top?0:(big?.7:.22)*s,mz);}A.camera.updateMatrixWorld(true);const clip=new T.Plane(new T.Vector3(0,-1,0),(big?2.4:1.1)*s);A.renderer.localClippingEnabled=true;for(const m of [...A.propMeshes,...A.ghostMeshes]){m.material.clippingPlanes=view==='root-top'?[clip]:[];m.material.clipShadows=true;if(m.customDepthMaterial){m.customDepthMaterial.clippingPlanes=view==='root-top'?[clip]:[];m.customDepthMaterial.clipShadows=true;}}if(view==='root-top'){A.camera.position.y=(big?17:5.5)*s*($('neighbors').checked?1.6:1);A.camera.updateMatrixWorld(true);}W.TDPineWind.set(0,.8,.6,0);A.render();const a=W.TDSharedProps.asset(id),r=A.renderer.info.render;$('status').textContent=a.displayName+' / '+a.triangles.length/3+'三角形 / 1材質 / シーン全体 '+r.calls+'描画 / '+(view==='root-top'?'検査用の樹冠切り取り':'実エディタの材質・影・地面')+'。写真や地面パッチは使っていません。';window.contactReady=true;}
frame.addEventListener('load',async()=>{try{const W=frame.contentWindow;for(let i=0;i<240;i++){if(W.__app&&!W.document.getElementById('save').disabled)break;await new Promise(r=>setTimeout(r,100));}if(!W.__app)throw Error('エディタが起動しませんでした');W.requestAnimationFrame=()=>0;await new Promise(r=>setTimeout(r,100));W.document.querySelectorAll('body>:not(canvas):not(script):not(style)').forEach(e=>e.style.visibility='hidden');for(const a of W.TDSharedData.assets.filter(a=>a.rootGrounding))$('tree').add(new Option(a.displayName,a.id));$('tree').value=new URLSearchParams(location.search).get('id')||'oak';ready=true;arrange();}catch(e){$('status').textContent=e.message;}});for(const id of ['tree','ground','view','scale','slope','neighbors'])$(id).onchange=arrange;
</script></html>
