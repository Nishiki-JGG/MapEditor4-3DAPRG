<!doctype html><meta charset="utf-8"><title>自然物の配置例</title>
<style>html,body{margin:0;height:100%;font:14px sans-serif;background:#111;color:#eee}#bar{position:fixed;z-index:2;top:8px;left:8px;background:#111e;padding:8px;border-radius:5px;max-width:95vw}button,select{padding:5px;margin:2px}iframe{width:100%;height:100%;border:0;display:block}#hint{font-size:12px;color:#ccc}</style>
<div id="bar"><span id="buttons"></span><button onclick="naturePreview.setAngle(false)">真上90度</button><button onclick="naturePreview.setAngle(true)">斜め</button><button onclick="naturePreview.rootView()">世界樹の根元</button><select id="wind"><option value="none">無風</option><option value="breeze">そよ風</option><option value="gale">強風</option></select><div id="hint">本体を読み込み中…</div></div>
<iframe id="map" src="../index.html?preview=night1#size=64" title="本体エンジンによる自然物の配置例"></iframe><script src="nature_scenes.js?v=night1"></script><script>
let sceneReady=false,current=TDNatureScenes[0],oblique=false,rootDetail=false,run=true,A=null,W=null;const frame=document.getElementById('map'),hint=document.getElementById('hint');
function pose(){A.playCam.pitch=oblique?.88:Math.PI/2;A.playCam.yaw=0;if(current.id==='world'&&rootDetail){A.camera.position.set(8,10,12);A.camera.up.set(0,1,0);A.camera.lookAt(0,3.8,0);A.camera.updateMatrixWorld(true);}else if(current.id==='world'){A.camera.position.set(oblique?20:0,oblique?65:76,oblique?38:0);A.camera.up.set(0,oblique?1:0,oblique?0:-1);A.camera.lookAt(0,oblique?9:0,0);A.camera.updateMatrixWorld(true);}}
function choose(id){if(!A)return;sceneReady=false;rootDetail=false;current=TDNatureScenes.find(s=>s.id===id)||TDNatureScenes[0];A.setMode('edit');A.genFlat();A.deserialize(A.serialize());A.state.sunOn=true;A.state.atmo.kind='none';for(const[id,x,z,yaw,scale,sy]of current.props)A.props.push([A.PROP.findIndex(t=>t.id===id),x,z,yaw,scale,0,sy,null]);A.ensureIds();A.rebuildProps();A.state.agent.height=1.8;A.state.spawn={x:current.spawn[0],z:current.spawn[1]};A.setMode('play');A.keys.clear();A.playCam.dist=current.distance;setWind(document.getElementById('wind').value);A.update(0);pose();A.render();hint.textContent=current.name+' / WASDで歩行（画面をクリックして操作） / 配置例は保存済みマップへ影響しません';sceneReady=true;}
function setWind(value){document.getElementById('wind').value=value;if(A){A.state.weather={kind:value,amount:.7};A.applyAtmo();}}
window.naturePreview={choose,setWind,setAngle(value){rootDetail=false;oblique=value;if(A){A.update(0);pose();A.render();}},rootView(){if(!A)return;choose('world');rootDetail=true;pose();A.render();},stop(){run=false;},state(){return{ready:sceneReady,id:current.id,props:A?.props.length,wind:A?.state.weather.kind,types:A?.PROP.length};}};
for(const s of TDNatureScenes){const b=document.createElement('button');b.textContent=s.name;b.onclick=()=>choose(s.id);document.getElementById('buttons').append(b);}document.getElementById('wind').onchange=e=>setWind(e.target.value);
let previous=performance.now();async function start(){for(let i=0;i<240;i++){try{if(frame.contentWindow.__app){W=frame.contentWindow;A=W.__app;break;}}catch{}await new Promise(r=>setTimeout(r,250));}if(!A){hint.textContent='読み込めませんでした。Pagesの公開URLから開いてください。';return;}W.requestAnimationFrame=()=>0;W.document.querySelectorAll('body>:not(canvas):not(script):not(style)').forEach(e=>e.style.visibility='hidden');W.document.addEventListener('pointerdown',e=>{W.focus();e.stopImmediatePropagation();e.preventDefault();},true);choose(current.id);function tick(now){const dt=Math.min(.05,(now-previous)/1000);previous=now;if(run&&A){A.update(dt);pose();A.render();}requestAnimationFrame(tick);}requestAnimationFrame(tick);}start();
</script>
