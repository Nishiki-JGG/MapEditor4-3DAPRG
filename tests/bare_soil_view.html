<!doctype html><html lang="ja"><meta charset="utf-8"><title>裸地での植生の接地確認</title>
<style>body{margin:0;background:#151b20;color:#eee;font:14px sans-serif}header{min-height:64px;padding:7px;box-sizing:border-box}select,label{margin-right:8px}iframe{display:block;border:0;width:100%;height:calc(100vh - 70px)}#status{margin-top:5px;font-size:12px}</style>
<header><select id="kind"><option value="mixed">土道の混在シーン</option><option value="pine">針葉樹</option><option value="sugi">スギ</option><option value="hinoki">ヒノキ</option><option value="scotspine">傘形の松</option><option value="bush">茂み</option><option value="hazel">株立ち低木</option><option value="grass">草むら</option><option value="worldtree">世界樹</option></select><select id="ground"><option value="dirt">裸の土</option><option value="road">土道</option><option value="edge">土と草の境界</option><option value="grass">草地（比較用）</option></select><select id="view"><option value="walk">歩行カメラ</option><option value="low">低い補助視点</option><option value="top">真上90度</option></select><select id="scale"><option value="1">標準サイズ</option><option value=".65">0.65倍</option><option value="1.35">1.35倍</option></select><label><input id="sun" type="checkbox" checked>太陽</label><label><input id="slope" type="checkbox">緩斜面10%</label><label><input id="neighbors" type="checkbox">隣接</label><div id="status">実エディタを読み込み中。見た目の静止比較です。本体の揺れを無効化する変更はありません。</div></header>
<iframe id="editor" src="../index.html?v=bush-volume1#size=64" title="裸地の比較用・実エディタ"></iframe>
<script>
let ready=false;window.soilReady=false;const $=id=>document.getElementById(id);
function arrange(){if(!ready)return;const W=$('editor').contentWindow,A=W.__app,T=W.THREE,id=$('kind').value,ground=$('ground').value,view=$('view').value,scale=+$('scale').value,grade=$('slope').checked?.1:0,big=id==='worldtree',N=Math.sqrt(A.H.length);A.setMode('edit');A.genFlat();A.deserialize(A.serialize());A.applyBiome('forest');A.state.sunOn=$('sun').checked;A.state.weather.kind='none';A.state.atmo.kind='none';A.state.water=-20;A.applyAtmo();A.S.fill(0);for(let j=0;j<N;j++)for(let i=0;i<N;i++){const x=i/(N-1)*A.SIZE-A.SIZE/2,z=j/(N-1)*A.SIZE-A.SIZE/2,k=j*N+i;A.H[k]=grade*x;const road=Math.abs(x-.35*Math.sin(z*.4));A.S[k*9]=ground==='dirt'?255:ground==='road'?Math.round(255*Math.max(0,Math.min(.78,(3.5-road)/1.5))):ground==='edge'?Math.round(255*Math.max(0,Math.min(1,(x+1.2)/2.4))):0;}A.updateTerrain();const props=id==='mixed'?[['pine',-1.6,.3,.2,1],['sugi',2.5,1.4,1.8,1],['hinoki',-2.5,5,.8,1],['bush',-.3,-1.2,.2,1],['hazel',1.1,1.3,1.2,.7],['grass',.5,-.5,1,1],['grass',-.8,2.6,2,.8],['fern',-1.2,-2.8,.4,.85]]:[[id,0,0,.39,scale]];if($('neighbors').checked&&id!=='mixed')props.push([id,big?8:2.3,big?2:1.2,1.8,scale*.8]);for(const[k,x,z,r,s]of props)A.props.push([A.PROP.findIndex(t=>t.id===k),x,z,r,s,0,1,null]);A.ensureIds();A.rebuildProps();A.state.spawn={x:big?7:1.7,z:id==='mixed'?-4:0};A.setMode('play');A.keys.clear();A.playCam.pitch=view==='top'?Math.PI/2:.65;A.playCam.dist=big?50:id==='mixed'?15:12;A.playCam.yaw=.3;A.update(0);if(view==='low'){A.camera.position.set(big?11:3.2,big?4.2:1.6,big?15:5.2);A.camera.up.set(0,1,0);A.camera.lookAt(0,big?.7:.22,0);}if(view==='top'){A.camera.position.set(0,big?55:id==='mixed'?23:12,0);A.camera.up.set(0,0,-1);A.camera.lookAt(0,0,0);}if($('neighbors').checked&&id!=='mixed'){const mx=big?4:1.15,mz=big?1:.6;A.camera.position.x+=mx;A.camera.position.z+=mz;if(view==='top')A.camera.position.y*=1.5;else A.camera.position.z+=big?8:2;A.camera.lookAt(mx,view==='low'?.25:0,mz);}A.camera.updateMatrixWorld(true);W.TDPineWind.set(0,.8,.6,0);A.render();const target=A.PROP.find(t=>t.id===id),g=target?.geo;$('status').textContent=(id==='mixed'?'混在シーン':target.name+' / '+(g.index?g.index.count/3:g.attributes.position.count/3)+'三角形')+' / 全体'+A.renderer.info.render.calls+'描画 / 静止比較・実エディタの地面と材質。丸い影シールや透明な地面パッチは使用していません。';window.soilReady=true;}
$('editor').addEventListener('load',async()=>{try{const W=$('editor').contentWindow;for(let i=0;i<240;i++){if(W.__app&&!W.document.getElementById('save').disabled)break;await new Promise(r=>setTimeout(r,100));}if(!W.__app)throw Error('エディタを起動できませんでした');W.requestAnimationFrame=()=>0;await new Promise(r=>setTimeout(r,100));W.document.querySelectorAll('body>:not(canvas):not(script):not(style)').forEach(e=>e.style.visibility='hidden');ready=true;arrange();}catch(e){$('status').textContent=e.message;}});for(const id of ['kind','ground','view','scale','sun','slope','neighbors'])$(id).onchange=arrange;
</script></html>
