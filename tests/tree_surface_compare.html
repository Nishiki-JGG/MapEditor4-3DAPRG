<!doctype html><html lang="ja"><meta charset="utf-8"><title>葉塊と樹皮の品質比較</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>body{margin:0;padding:18px;background:#182021;color:#eee;font:16px/1.6 sans-serif}a{color:#b8d8c0}h1{font-size:24px}h2{font-size:19px}.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}figure{margin:0}img{width:100%;height:auto}@media(max-width:700px){.pair{grid-template-columns:1fr}}</style><h1>葉塊と樹皮の反復を抑える改善</h1><p>同じカメラ・照明・配置で比較。ポリゴン数・頂点数・画像メモリ・材質数は前後同じです。根元近接は検査用に樹冠を切断しています。</p><p><a href="root_reference_view.html">実エディタで確認</a> · <a href="../docs/TREE_SURFACE_POLISH.md">変更点・負荷・限界</a> · <a href="../index.html#size=64">エディタ本体</a></p><section><h2>広葉樹・人物と同じ歩行補助視点</h2><div class="pair"><figure><figcaption>変更前 372797f</figcaption><img src="../docs/images/tree-surface/before-oak-walk.webp" alt="変更前・広葉樹・人物と同じ歩行補助視点"></figure><figure><figcaption>今回の改善</figcaption><img src="../docs/images/tree-surface/after-oak-walk.webp" alt="改善後・広葉樹・人物と同じ歩行補助視点"></figure></div></section><section><h2>広葉樹・真上90度</h2><div class="pair"><figure><figcaption>変更前 372797f</figcaption><img src="../docs/images/tree-surface/before-oak-top.webp" alt="変更前・広葉樹・真上90度"></figure><figure><figcaption>今回の改善</figcaption><img src="../docs/images/tree-surface/after-oak-top.webp" alt="改善後・広葉樹・真上90度"></figure></div></section><section><h2>広葉樹の樹皮と裸地の根元</h2><div class="pair"><figure><figcaption>変更前 372797f</figcaption><img src="../docs/images/tree-surface/before-oak-root.webp" alt="変更前・広葉樹の樹皮と裸地の根元"></figure><figure><figcaption>今回の改善</figcaption><img src="../docs/images/tree-surface/after-oak-root.webp" alt="改善後・広葉樹の樹皮と裸地の根元"></figure></div></section><section><h2>ナラ・真上90度</h2><div class="pair"><figure><figcaption>変更前 372797f</figcaption><img src="../docs/images/tree-surface/before-nara-top.webp" alt="変更前・ナラ・真上90度"></figure><figure><figcaption>今回の改善</figcaption><img src="../docs/images/tree-surface/after-nara-top.webp" alt="改善後・ナラ・真上90度"></figure></div></section><section><h2>ケヤキの葉塊と枝の隙間</h2><div class="pair"><figure><figcaption>変更前 372797f</figcaption><img src="../docs/images/tree-surface/before-zelkova-walk.webp" alt="変更前・ケヤキの葉塊と枝の隙間"></figure><figure><figcaption>今回の改善</figcaption><img src="../docs/images/tree-surface/after-zelkova-walk.webp" alt="改善後・ケヤキの葉塊と枝の隙間"></figure></div></section><section><h2>橋・川・道を保った実マップ</h2><div class="pair"><figure><figcaption>変更前 372797f</figcaption><img src="../docs/images/tree-surface/before-bridge-context.webp" alt="変更前・橋・川・道を保った実マップ"></figure><figure><figcaption>今回の改善</figcaption><img src="../docs/images/tree-surface/after-bridge-context.webp" alt="改善後・橋・川・道を保った実マップ"></figure></div></section><p>写真画素の転用はありません。葉塊の基本輪郭や近接の樹皮タイルには繰り返しが残るため、仕上がり目標への改善途中です。</p></html>
