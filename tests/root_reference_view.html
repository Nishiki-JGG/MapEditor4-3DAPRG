<!doctype html><html lang="ja"><meta charset="utf-8"><title>資料に基づく根張りと葉塊の確認</title>
<style>body{margin:0;background:#171e20;color:#eee;font:14px sans-serif}header{height:66px;padding:7px;box-sizing:border-box}select,label{margin-right:8px}iframe{display:block;border:0;width:100%;height:calc(100vh - 66px)}#status{font-size:12px;margin-top:4px}</style>
<header><select id="tree"></select><select id="view"><option value="walk">歩行の補助視点</option><option value="top">真上90度</option><option value="root">根元近接・樹冠切断</option><option value="root-top">根元真上・樹冠切断</option></select><select id="ground"><option value="dirt">裸地</option><option value="grass">草地</option><option value="edge">土草境界</option></select><select id="scale"><option value="1">標準</option><option value=".7">0.7倍</option><option value="1.3">1.3倍</option></select><label><input id="slope" type="checkbox">10%斜面</label><label><input id="sun" type="checkbox" checked>太陽</label><div id="status">実エディタを読み込み中。写真や地面パッチは使っていません。</div></header>
<iframe id="editor" src="../index.html?v=broadleaf-structure1#size=64" title="実エディタによる2本の木の比較"></iframe><script>
let ready=false;window.referenceReady=false;const $=id=>document.getElementById(id);
function arrange(){if(!ready)return;const W=$('editor').contentWindow,A=W.__app,T=W.THREE,id=$('tree').value,s=+$('scale').value,view=$('view').value,grade=$('slope').checked?.1:0,ground=$('ground').value,big=id==='worldtree',spacing=(big?14:5.2)*s,N=Math.sqrt(A.H.length);A.setMode('edit');A.genFlat();A.deserialize(A.serialize());A.applyBiome('forest');A.state.water=-20;A.state.sunOn=$('sun').checked;A.state.weather.kind='none';A.state.atmo.kind='none';A.applyAtmo();A.S.fill(0);for(let j=0;j<N;j++)for(let i=0;i<N;i++){const x=i/(N-1)*A.SIZE-A.SIZE/2,k=j*N+i;A.H[k]=grade*x;A.S[k*9]=ground==='dirt'?255:ground==='edge'?Math.round(255*Math.max(0,Math.min(1,(x+1.5)/3))):0;}A.updateTerrain();const type=A.PROP.findIndex(t=>t.id===id);A.props.push([type,-spacing/2,0,.39,s,0,1,null],[type,spacing/2,1.0*s,2.14,s,0,1,null]);A.ensureIds();A.rebuildProps();A.state.spawn={x:0,z:2.3*s};A.setMode('play');A.keys.clear();A.update(0);const root=view.startsWith('root'),top=view==='top'||view==='root-top',distance=(big?65:19)*s;A.camera.up.set(0,top?0:1,top?-1:0);if(root){const x=-spacing/2;A.camera.position.set(x+(top?0:1.7)*s,(top?4.1:1.0)*s,(top?0:2.7)*s);A.camera.lookAt(x,.15*s,0);}else{A.camera.position.set(top?0:4*s,top?distance:(big?14:8)*s,top?0:14*s);A.camera.lookAt(0,top?0:2*s,0);}A.camera.updateMatrixWorld(true);A.renderer.localClippingEnabled=true;const clip=new T.Plane(new T.Vector3(0,-1,0),(big?3:1.2)*s);for(const m of A.propMeshes){m.material.clippingPlanes=root?[clip]:[];m.material.clipShadows=true;if(m.customDepthMaterial){m.customDepthMaterial.clippingPlanes=root?[clip]:[];m.customDepthMaterial.clipShadows=true;}}W.TDPineWind.set(0,.8,.6,0);A.render();const m=A.propMeshes[type];window.referenceState={id,view,ground,scale:s,slope:grade,sun:$('sun').checked,calls:A.renderer.info.render.calls,triangles:A.renderer.info.render.triangles,modelTriangles:A.PROP[type].geo.index.count/3,cameraDirection:A.camera.getWorldDirection(new T.Vector3()).toArray(),rootContext:Array.from(m.userData.rootTerrain.array.slice(0,4)),errors:A.renderer.info.programs.filter(p=>p.diagnostics&&!p.diagnostics.runnable).map(p=>p.diagnostics.programLog)};$('status').textContent=A.PROP[type].name+' / '+referenceState.modelTriangles+'三角形 / 各種1材質 / 全景 '+referenceState.calls+'描画 / 根元の表示は検査用に樹冠を切断。';referenceReady=true;}
$('editor').addEventListener('load',async()=>{try{const W=$('editor').contentWindow;for(let i=0;i<240;i++){if(W.__app&&!W.document.getElementById('save').disabled)break;await new Promise(r=>setTimeout(r,100));}if(!W.__app)throw Error('エディタの起動失敗');W.requestAnimationFrame=()=>0;await new Promise(r=>setTimeout(r,100));W.document.querySelectorAll('body>:not(canvas):not(script):not(style)').forEach(e=>e.style.visibility='hidden');for(const a of W.TDSharedData.assets.filter(a=>a.rootGrounding))$('tree').add(new Option(a.displayName,a.id));$('tree').value=new URLSearchParams(location.search).get('id')||'oak';ready=true;arrange();}catch(e){$('status').textContent=e.message;}});for(const id of ['tree','view','ground','scale','slope','sun'])$(id).onchange=arrange;
</script></html>
