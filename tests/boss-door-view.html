const scene=new THREE.Scene();scene.background=new THREE.Color(0x353d45);const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(1);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;renderer.shadowMap.enabled=true;document.body.append(renderer.domElement);const camera=new THREE.PerspectiveCamera(35,innerWidth/innerHeight,.1,100);scene.add(new THREE.HemisphereLight(0xd5e6ff,0x8b7d6b,2.3));const sun=new THREE.DirectionalLight(0xffedce,3.8);sun.position.set(-6,11,9);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-10,right:10,top:12,bottom:-8});scene.add(sun);const fill=new THREE.DirectionalLight(0xc2daff,2);fill.position.set(4,5,-5);scene.add(fill);const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0x727c7f,roughness:1}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);let mesh;window.show=(kind,yaw=.26,pitch=.18)=>{if(mesh)scene.remove(mesh);mesh=new THREE.Mesh(TDBossDoors.geometry(kind),TDBossDoors.material(kind));mesh.castShadow=mesh.receiveShadow=true;scene.add(mesh);const h=kind==='metal'?7.3:6.25,d=kind==='metal'?15.5:13.5;camera.position.set(Math.sin(yaw)*d,h*.49+Math.sin(pitch)*d,Math.cos(yaw)*d);camera.lookAt(0,h*.49,0);renderer.render(scene,camera);return{triangles:mesh.geometry.attributes.position.count/3,bounds:mesh.geometry.boundingBox}};show('stone');
