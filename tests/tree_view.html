<!doctype html><meta charset="utf-8"><title>樹種と樹冠の確認</title>
<style>html,body{margin:0;background:#b7c6ce;overflow:hidden;font:14px sans-serif}canvas{display:block}#bar{position:fixed;z-index:3;left:8px;top:8px;padding:9px;background:#fffffff0;border-radius:6px}button,select{padding:5px;margin:2px}.label{position:absolute;z-index:2;background:#ffffffe0;padding:3px 6px;transform:translateX(-50%);white-space:nowrap;pointer-events:none}#note{position:fixed;bottom:8px;left:8px;background:#ffffffe0;padding:8px}</style>
<div id="bar">木の確認 / 人型1.8 m<br><button onclick="arrange('new')">追加11種</button><button onclick="arrange('old')">既存12種</button><button onclick="arrange('conifers')">針葉</button><button onclick="arrange('silver')">銀緑</button><button onclick="arrange('fantasy')">幻想木</button><button onclick="arrange('worldtree')">世界樹（24m）</button><select id="pick"></select><button onclick="angle(false)">真上90度</button><button onclick="angle(true)">斜め</button><button onclick="lowDragon()">龍血樹の低い視点</button><select id="wind"><option value="none">無風</option><option value="breeze">そよ風</option><option value="gale" selected>強風</option></select><label><input id="contact" type="checkbox">歩行接触</label></div>
<div id="note">既存の木の配置寸法は維持。世界樹は24mの専用大木です。高い枝葉は通常の人型には接触しません。</div>
<script src="../three.min.js"></script><script src="../props/shared/assets.js?v=bare-soil1"></script><script src="../props/shared/pine-wind.js?v=root-bark1"></script><script src="../props/shared/shared.js?v=root-bark1"></script><script>
const newTrees=['maple','cherry','zelkova','nara','sugi','hinoki','islandash','olive','eucalyptus','dragontree','elftree','worldtree'],oldTrees=['oak','pine','palm','banana','deadtree','twisttree','birch','willow','scotspine','rowan','hazel','juniper'];
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(1600,1100);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;renderer.shadowMap.enabled=true;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#b7c6ce');scene.add(new THREE.HemisphereLight(0xd6e8ff,0x6a5a3e,1.05));const sun=new THREE.DirectionalLight(0xffe0b0,2.6);sun.position.set(-48,62,-14);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-34,right:34,top:34,bottom:-34,far:180});scene.add(sun);
const camera=new THREE.OrthographicCamera(-20,20,13.75,-13.75,.1,240),ground=new THREE.Mesh(new THREE.PlaneGeometry(180,180).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({color:'#899774'}));ground.receiveShadow=true;scene.add(ground);
const objects=[],humans=[],labels=[];let selected=[],oblique=false,run=true,time=0,wind='gale',contact=false,half=20;window.treeReady=false;THREE.DefaultLoadingManager.onLoad=()=>{renderer.render(scene,camera);treeReady=true;};
for(const id of [...newTrees,...oldTrees])document.getElementById('pick').add(new Option(TDSharedProps.asset(id).displayName,id));document.getElementById('pick').insertBefore(new Option('単体を見る',''),document.getElementById('pick').firstChild);document.getElementById('pick').selectedIndex=0;document.getElementById('pick').onchange=e=>{if(e.target.value)arrange(e.target.value);};document.getElementById('wind').onchange=e=>wind=e.target.value;document.getElementById('contact').onchange=e=>contact=e.target.checked;
window.angle=value=>{oblique=value;camera.left=-half;camera.right=half;camera.top=half*1100/1600;camera.bottom=-camera.top;camera.updateProjectionMatrix();const targetY=selected.length===1?Math.min(6,TDSharedProps.asset(selected[0]).wind.maxY*.32):2;camera.up.set(0,0,-1);camera.position.set(0,80,value?56:0);camera.lookAt(0,value?targetY:0,0);camera.updateMatrixWorld(true);for(let i=0;i<objects.length;i++){const o=objects[i],p=new THREE.Vector3(o.position.x,0,o.position.z+(selected.length===1?2.5:3.4)).project(camera);labels[i].style.left=(p.x+1)*800+'px';labels[i].style.top=(1-p.y)*550+'px';}renderer.render(scene,camera);};
window.arrange=mode=>{for(const o of objects){scene.remove(o);o.geometry.dispose();o.material.dispose();o.customDepthMaterial?.dispose();}for(const h of humans){scene.remove(h);h.geometry.dispose();h.material.dispose();}for(const l of labels)l.remove();objects.length=humans.length=labels.length=0;selected=mode==='new'?newTrees.filter(id=>id!=='worldtree'):mode==='old'?oldTrees:mode==='conifers'?['pine','sugi','hinoki','scotspine']:mode==='silver'?['islandash','olive','eucalyptus','birch']:mode==='fantasy'?['elftree','twisttree']:[mode];half=selected.length===1?(mode==='worldtree'?26:Math.max(5,TDSharedProps.asset(mode).contact.radius+2)):selected.length<=2?13:20;
 for(let i=0;i<selected.length;i++){const id=selected[i],a=TDSharedProps.asset(id),g=TDSharedProps.geometry(id);g.setAttribute('touch',new THREE.InstancedBufferAttribute(new Float32Array(3),3));const o=new THREE.InstancedMesh(g,TDPineWind.touchMaterial(TDSharedProps.material(id)),1);o.setMatrixAt(0,new THREE.Matrix4());o.frustumCulled=false;o.userData.spring={bx:0,bz:0,vx:0,vz:0};o.position.set(selected.length===1?0:(i%Math.min(4,selected.length)-(Math.min(4,selected.length)-1)/2)*8.6,0,selected.length===1?0:(Math.floor(i/4)-(Math.ceil(selected.length/4)-1)/2)*8.6);o.castShadow=true;o.receiveShadow=['deadtree','twisttree','hazel','juniper'].includes(id);o.customDepthMaterial=TDPineWind.shadowMaterial(o.material);scene.add(o);objects.push(o);const human=new THREE.Mesh(new THREE.CapsuleGeometry(.3,1.2,3,8),new THREE.MeshLambertMaterial({color:'#deb58b'}));human.castShadow=true;human.position.set(o.position.x+(id==='worldtree'?2.6:3.1),.9,o.position.z+2.0);scene.add(human);humans.push(human);const label=document.createElement('div');label.className='label';label.textContent=a.displayName+' / '+a.triangles.length/3+' tri';document.body.append(label);labels.push(label);}document.getElementById('pick').value=selected.length===1?mode:'';angle(oblique);};
window.stepTree=dt=>{time+=dt;TDPineWind.set(time,.8,.6,wind==='gale'?.7:wind==='breeze'?.245:0);for(let i=0;i<objects.length;i++){const o=objects[i],a=TDSharedProps.asset(selected[i]),cfg=a.contact,h=humans[i],prev=h.userData.previous;let target=[0,0];if(contact){const x=o.position.x+Math.sin(time+i*.4)*2.0,z=o.position.z+.12;h.position.set(x,.9,z);if(cfg.minY<1.8)target=TDPineWind.target(o.position.x-x,o.position.z-z,cfg.radius+.3,prev&&dt>0?(x-prev[0])/dt:0,0,cfg.maxDisplacementMetres);h.userData.previous=[x,z];}else{h.userData.previous=null;h.position.set(o.position.x+(selected[i]==='worldtree'?2.6:3.1),.9,o.position.z+2.0);}TDPineWind.advance(o.userData.spring,...target,cfg.maxDisplacementMetres,dt);const touch=o.geometry.attributes.touch;touch.setXYZ(0,o.userData.spring.bx,o.userData.spring.bz,1/a.wind.maxY);touch.needsUpdate=true;}renderer.render(scene,camera);};
window.treePreview={stop(){run=false;},setWind(value){wind=value;document.getElementById('wind').value=value;},setContact(value){contact=value;document.getElementById('contact').checked=value;},state(){return{selected,time,wind,contact,count:objects.length,ready:treeReady};}};window.lowDragon=()=>{if(selected.length!==1||selected[0]!=='dragontree')arrange('dragontree');camera.left=-4.8;camera.right=4.8;camera.top=3.3;camera.bottom=-3.3;camera.up.set(0,1,0);camera.position.set(9,2,12);camera.lookAt(0,3.2,0);camera.updateProjectionMatrix();camera.updateMatrixWorld(true);renderer.render(scene,camera);};const query=new URLSearchParams(location.search),requested=query.get('id');arrange([...newTrees,...oldTrees].includes(requested)?requested:'new');if(query.get('view')==='low')lowDragon();let previous=performance.now();function frame(now){const dt=Math.min(.05,(now-previous)/1000);previous=now;if(run)stepTree(dt);requestAnimationFrame(frame);}requestAnimationFrame(frame);
</script>
