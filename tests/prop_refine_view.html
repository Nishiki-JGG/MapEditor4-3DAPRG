<!doctype html><meta charset="utf-8"><title>木材小物の磨き込み</title>
<style>html,body{overflow:hidden;margin:0;background:#b9c7d0;font:14px sans-serif}canvas{display:block}#bar{z-index:2;position:fixed;top:8px;left:12px;background:#ffffffdf;padding:8px;border-radius:6px}button,select{margin:3px;padding:5px}.label{z-index:1;position:absolute;transform:translateX(-50%);background:#ffffffd8;padding:3px 7px;border-radius:4px;pointer-events:none;white-space:nowrap}</style>
<div id="bar">基準人型 1.8 m / 標準倍率1　<button onclick="view('all','top')">真上90度</button><button onclick="view('all','oblique')">斜め一覧</button><button onclick="view('all','far')">遠景</button><select id="asset"></select></div>
<script src="../three.min.js"></script><script src="../props/shared/assets.js?v=refine2"></script><script src="../props/shared/pine-wind.js?v=understory1"></script><script src="../props/shared/shared.js?v=understory1"></script><script>
const ids=['log','stump','rootfan','driftwood','woodfence'];
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(1600,1000);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;renderer.shadowMap.enabled=true;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#b9c7d0');scene.add(new THREE.HemisphereLight(0xd6e8ff,0x6a5a3e,1.05));const sun=new THREE.DirectionalLight(0xffe0b0,2.6);sun.position.set(-48,62,-14);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-12,right:12,top:12,bottom:-12,far:150});scene.add(sun);
const camera=new THREE.OrthographicCamera(-15,15,9.375,-9.375,.1,100);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({color:'#899774'}));ground.receiveShadow=true;scene.add(ground);
const poses=[[-4,-2.3],[0,-2.3],[4,-2.3],[-2,2.2],[2,2.2]],objects=[],humans=[],labels=[];
window.plantGalleryReady=false;THREE.DefaultLoadingManager.onLoad=()=>{renderer.render(scene,camera);window.plantGalleryReady=true;};
for(let i=0;i<ids.length;i++){const a=TDSharedProps.asset(ids[i]),geo=TDSharedProps.geometry(a.id);geo.setAttribute('touch',new THREE.InstancedBufferAttribute(new Float32Array(3),3));const o=new THREE.InstancedMesh(geo,a.motionWeights?TDPineWind.touchMaterial(TDSharedProps.material(a.id)):TDSharedProps.material(a.id),1);o.setMatrixAt(0,new THREE.Matrix4());o.frustumCulled=false;o.userData.spring={bx:0,bz:0,vx:0,vz:0};o.position.set(poses[i][0],0,poses[i][1]);o.castShadow=true;if(a.wind)o.customDepthMaterial=TDPineWind.shadowMaterial(o.material);scene.add(o);objects.push(o);const human=new THREE.Mesh(new THREE.CapsuleGeometry(.3,1.2,3,8),new THREE.MeshLambertMaterial({color:'#deb58b'}));human.position.set(poses[i][0]+.65,.9,poses[i][1]+1.1);scene.add(human);humans.push(human);const label=document.createElement('div');label.className='label';label.textContent=a.displayName+' / '+a.triangles.length/3+' tri';document.body.append(label);labels.push(label);document.getElementById('asset').add(new Option(a.displayName,a.id));}
document.getElementById('asset').insertBefore(new Option('単体を見る',''),document.getElementById('asset').firstChild);document.getElementById('asset').selectedIndex=0;document.getElementById('asset').onchange=e=>{if(e.target.value)view(e.target.value,'top');};
window.view=(mode='all',angle='top')=>{let active=ids.map(()=>true);if(mode==='trees')active=ids.map((_,i)=>ids[i]==='rowan');else if(mode==='low')active=ids.map((_,i)=>ids[i]!=='rowan');else if(ids.includes(mode))active=ids.map(id=>id===mode);let target=new THREE.Vector3(0,0,0),size=8.5;if(mode==='trees'){target.set(-4,0,-3);size=4.8;}else if(mode==='low'){target.z=1;size=7;}else if(ids.includes(mode)){const i=ids.indexOf(mode);target.set(...[poses[i][0],0,poses[i][1]]);size=3.1;}if(angle==='oblique'){target.y=ids.includes(mode)?Math.max(...TDSharedProps.asset(mode).positions.filter((v,i)=>i%3===1))*.45:2.5;size*=1.17;}if(angle==='far')size*=1.9;document.getElementById('asset').value=ids.includes(mode)?mode:'';camera.left=-size;camera.right=size;camera.top=size/1.6;camera.bottom=-camera.top;camera.updateProjectionMatrix();camera.up.set(0,0,-1);camera.position.copy(target).add(new THREE.Vector3(0,35,angle==='oblique'?26:0));camera.lookAt(target);camera.updateMatrixWorld(true);for(let i=0;i<ids.length;i++){objects[i].visible=humans[i].visible=active[i];labels[i].style.display=active[i]?'block':'none';const h=1.8,p=new THREE.Vector3(poses[i][0],0,poses[i][1]+h).project(camera);labels[i].style.left=(p.x+1)*800+'px';labels[i].style.top=(1-p.y)*500+'px';}renderer.render(scene,camera);};view();

</script>
