<!doctype html><meta charset="utf-8"><title>洞窟キットのローカル比較</title>
<style>body{margin:0;background:#10151b;color:#eee;font:14px sans-serif}header{height:42px;display:flex;align-items:center;gap:12px;padding:0 12px}select,label{color:#eee;background:#25313d;padding:4px}iframe{border:0;width:100%;height:calc(100vh - 70px)}footer{font-size:12px;padding:4px 12px}</style>
<header>洞窟キット <select id="layout"><option value="single">石筍の比較</option><option value="kit">3素材一覧</option><option value="scene">乾燥部・入口の湿潤部</option></select><select id="view"><option>oblique</option><option>top</option><option>walk</option><option>low</option></select><select id="light"><option value="neutral">中立照明</option><option value="cave">洞窟の松明</option></select><label><input type="checkbox" id="before">旧石筍</label><label><input type="checkbox" id="slope">緩斜面</label><button id="refresh">再配置</button></header>
<iframe id="editor" src="../index.html#size=24"></iframe><footer>自作共有素材の隔離比較。水・地形機能の製品変更なし。正面Z側から壁裾を合わせる。</footer>
<script>
let W,A,oldGeometry,newGeometry,newMaterial,oldMaterial;
const ready=ms=>new Promise(r=>setTimeout(r,ms));
async function init(){W=editor.contentWindow;for(let k=0;k<300;k++){if(W.__app&&!W.__app.preparation)break;await ready(150);}A=W.__app;if(!A)throw Error('Editor did not load');W.requestAnimationFrame=()=>0;await ready(100);oldGeometry=new W.THREE.BufferGeometryLoader().parse(await(await fetch('cave-stalagmite-before.json')).json());const i=A.PROP.findIndex(t=>t.id==='stalagmite');newGeometry=A.propMeshes[i].geometry;newMaterial=A.propMeshes[i].material;oldMaterial=A.propMeshes[A.PROP.findIndex(t=>t.id==='rubblepile')].material;for(const el of W.document.querySelectorAll('body > :not(canvas)'))el.style.display='none';for(const id of ['layout','view','light','before','slope'])document.getElementById(id).onchange=arrange;refresh.onclick=arrange;arrange();window.caveReady=true;}
function arrange(){const T=W.THREE;A.setMode('edit');A.genFlat();A.applyBiome('cave');A.state.atmo.kind='none';A.state.weather.kind='none';A.state.water=-10;A.applyAtmo();A.H.fill(0);A.S.fill(0);for(let i=0;i<A.H.length;i++)A.S[i*9+3]=255;const n=Math.round(Math.sqrt(A.H.length));if(slope.checked)for(let j=0;j<n;j++)for(let i=0;i<n;i++)A.H[j*n+i]=(i/(n-1)*A.SIZE-A.SIZE/2)*.12;A.props.splice(0);const add=(id,x,z,angle=0,sc=1,sy=1)=>{const i=A.PROP.findIndex(t=>t.id===id);if(i<0)throw Error('Missing '+id);A.props.push([i,x,z,angle,sc,0,sy,null]);};if(layout.value==='single')add('stalagmite',0,0);else if(layout.value==='kit'){add('stalagmite',-3,0);add('flowstone',.4,0);add('cavebreakdown',3.7,0);}else{for(const x of [-6,-3,0,3,6])add('cliff',x,-3);add('stalagmite',-4,-1);add('stalagmite',-6,1,.7,.8);add('cavebreakdown',-2,0,.7);add('cavebreakdown',-5,3,2,.8);add('flowstone',2.5,-2.5);add('flowstone',5,-2.5,.2,.8);add('mossrock',5.5,-.4);add('fern',4.4,.1,.3,.8);add('fern',6,-.6,1,.65);add('torch',-1,2);add('torch',3,2);}
A.ensureIds();A.updateTerrain();A.rebuildProps();A.update(0);const i=A.PROP.findIndex(t=>t.id==='stalagmite'),mesh=A.propMeshes[i];mesh.geometry=before.checked?oldGeometry:newGeometry;mesh.material=before.checked?oldMaterial:newMaterial;const scene=A.terrain.parent;scene.children.filter(o=>o.geometry?.type==='ConeGeometry').forEach(o=>o.visible=false);A.hero.visible=true;A.hero.position.set(-1.8,A.heightAt(-1.8,1.2),1.2);const sun=scene.children.find(o=>o.isDirectionalLight);if(light.value==='neutral'){scene.children.filter(o=>o.isPointLight).forEach(o=>o.intensity=0);scene.children.filter(o=>o.isHemisphereLight).forEach(o=>o.intensity=.9);sun.intensity=2.1;sun.position.set(5,9,4);}else{scene.children.filter(o=>o.isHemisphereLight).forEach(o=>o.intensity=.13);sun.intensity=0;}
A.camera.up.set(0,1,0);const multi=layout.value!=='single',wide=layout.value==='scene'?1.55:1;let target=multi?new T.Vector3(.2,.6,0):new T.Vector3(0,.7,0);if(view.value==='top'){A.camera.up.set(0,0,-1);A.camera.position.set(0,(multi?14:7)*wide,0);}else if(view.value==='walk'){A.camera.position.set(multi?8:3,1.8,(multi?10:5)*wide);}else if(view.value==='low'){A.camera.position.set(multi?7:2,.8,(multi?9:4)*wide);}else A.camera.position.set((multi?8:4)*wide,(multi?9:5)*wide,(multi?12:6)*wide);if(slope.checked)A.camera.position.y+=A.heightAt(A.camera.position.x,A.camera.position.z);A.camera.lookAt(target);A.camera.updateMatrixWorld(true);A.setPanel(false);W.TDPineWind.set(0,.8,.6,0);A.render();window.caveStats={layout:layout.value,before:before.checked,view:view.value,calls:A.renderer.info.render.calls,triangles:A.renderer.info.render.triangles};}
editor.onload=()=>init().catch(e=>{document.querySelector('footer').textContent=e.stack;console.error(e);});
</script>
