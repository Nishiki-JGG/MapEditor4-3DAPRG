<!doctype html><meta charset="utf-8"><title>木の根元と樹皮の確認</title>
<style>body{margin:0;overflow:hidden;font:14px sans-serif;background:#c0c9cd}#bar{position:fixed;left:8px;top:8px;background:#fffffff0;padding:8px;z-index:2}button,select{margin:3px;padding:5px}#note{position:fixed;left:8px;bottom:8px;background:#fffffff0;padding:8px}</style>
<div id="bar"><select id="pick"></select><button onclick="rootView.view('root')">根元近接</button><button onclick="rootView.view('root-top')">根元を真上</button><button onclick="rootView.view('bark')">樹皮近接</button><button onclick="rootView.view('low')">人間目線</button><button onclick="rootView.view('top')">全体を真上</button><select onchange="rootView.slope(+this.value)"><option value="0">平面</option><option value=".1">緩斜面 10%</option></select></div><div id="note"></div>
<script src="../three.min.js"></script><script src="../props/shared/assets.js?v=root-contact1"></script><script src="../props/shared/pine-wind.js?v=root-contact1"></script><script src="../props/shared/shared.js?v=root-contact1"></script><script>
const ids=['maple','cherry','zelkova','nara','sugi','hinoki','islandash','olive','eucalyptus','dragontree','elftree','worldtree','oak','pine','palm','banana','deadtree','twisttree','birch','willow','scotspine','rowan','hazel','juniper'];
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);renderer.localClippingEnabled=true;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.3;renderer.shadowMap.enabled=true;document.body.append(renderer.domElement);
const scene=new THREE.Scene();scene.background=new THREE.Color('#c0c9cd');scene.add(new THREE.HemisphereLight(0xd6e8ff,0x6a5a3e,1.05));const sun=new THREE.DirectionalLight(0xffe0b0,2.6);sun.position.set(-48,62,-14);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-35,right:35,top:35,bottom:-35,far:180});scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(100,100).rotateX(-Math.PI/2),new THREE.MeshLambertMaterial({color:'#92927a'}));ground.receiveShadow=true;scene.add(ground);const camera=new THREE.OrthographicCamera(-2,2,1,-1,.1,250),clip=new THREE.Plane(new THREE.Vector3(0,-1,0),1.3);const human=new THREE.Mesh(new THREE.CapsuleGeometry(.25,1.3,3,8),new THREE.MeshLambertMaterial({color:'#d6b18a'}));human.castShadow=true;scene.add(human);
let item=null,current='oak',mode='root',grade=0;window.rootReady=false;THREE.DefaultLoadingManager.onLoad=()=>{rootReady=true;renderer.render(scene,camera)};
for(const id of ids)document.getElementById('pick').add(new Option(TDSharedProps.asset(id).displayName,id));document.getElementById('pick').onchange=e=>rootView.arrange(e.target.value);
window.rootView={arrange(id){if(item){scene.remove(item);item.geometry.dispose();item.material.dispose();item.customDepthMaterial?.dispose()}current=id;const a=TDSharedProps.asset(id),g=TDSharedProps.geometry(id);g.setAttribute('touch',new THREE.InstancedBufferAttribute(new Float32Array(3),3));g.setAttribute('rootSlope',new THREE.InstancedBufferAttribute(new Float32Array([grade,0]),2));item=new THREE.InstancedMesh(g,TDPineWind.touchMaterial(TDSharedProps.material(id)),1);item.setMatrixAt(0,new THREE.Matrix4());item.frustumCulled=false;item.castShadow=item.receiveShadow=true;item.customDepthMaterial=TDPineWind.shadowMaterial(item.material);scene.add(item);document.getElementById('pick').value=id;this.view(mode)},view(v){mode=v;const a=TDSharedProps.asset(current),h=a.wind?.maxY||4,big=current==='worldtree',elf=current==='elftree',rootHalf=big?6:elf?1.6:1.15,fullHalf=Math.max(4.5,a.contact?.radius+1||4.5,h*.65),half=v==='root'||v==='root-top'?rootHalf:v==='bark'?(big?2.5:1.1):fullHalf;camera.left=-half;camera.right=half;camera.top=half*innerHeight/innerWidth;camera.bottom=-camera.top;camera.up.set(0,1,0);human.visible=v==='low'||v==='top';human.position.set(big?2.6:2.1,.9,1.0);clip.constant=big?3.0:1.4;const crop=['root','root-top','bark'].includes(v);item.material.clippingPlanes=crop?[clip]:[];item.material.clipShadows=true;item.customDepthMaterial.clippingPlanes=crop?[clip]:[];item.customDepthMaterial.clipShadows=true;if(v==='root-top'||v==='top'){camera.up.set(0,0,-1);camera.position.set(0,Math.max(30,h*3),0);camera.lookAt(0,0,0)}else if(v==='root'){camera.position.set(rootHalf*1.9,rootHalf*.85,rootHalf*2.6);camera.lookAt(0,big?.8:.32,0)}else if(v==='bark'){clip.constant=big?6:3.5;camera.position.set(3,big?3:1.5,5);camera.lookAt(0,big?2.5:1.25,0)}else{camera.position.set(big?35:9,1.8,big?50:12);camera.lookAt(0,h*.43,0)}camera.updateProjectionMatrix();camera.updateMatrixWorld(true);TDPineWind.set(0,.8,.6,0);renderer.render(scene,camera);document.getElementById('note').textContent=a.displayName+' / '+a.triangles.length/3+' tri / '+(crop?'検査用：樹冠を切り取った表示':'人型1.8m')+' / '+(grade?'緩斜面10%':'平面')},slope(k){grade=k;const p=ground.geometry.attributes.position;for(let i=0;i<p.count;i++)p.setY(i,k*p.getX(i));p.needsUpdate=true;ground.geometry.computeVertexNormals();item.geometry.attributes.rootSlope.setXY(0,k,0);item.geometry.attributes.rootSlope.needsUpdate=true;this.view(mode)},state(){return{id:current,mode,grade,triangles:TDSharedProps.asset(current).triangles.length/3,ready:rootReady}}};const params=new URLSearchParams(location.search);rootView.arrange(params.get('id')||'oak');rootView.view(params.get('view')||'root');if(params.get('slope')==='0.1')rootView.slope(.1);
</script>
